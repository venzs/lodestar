name: Release

# Tag a commit vX.Y.Z and push the tag: the packager builds the zip, uploads it to GitHub
# Releases, and (once the secrets exist) to CurseForge, Wago and WoWInterface.
# Secrets to add in the repo settings: CF_API_KEY, WAGO_API_TOKEN, WOWI_API_TOKEN.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
